# Single source of truth for PorSurffi 2027.
# If an agent's answer disagrees with this file, this file wins.
# Every value carries a `source:` — chat date, document, or "assumption".

trip:
  name: PorSurffi 2027
  organization: PoRa / Prodeko, Aalto University
  edition: 2  # 2026 was PoRa's first surf trip ever

  destination:
    status: UNDECIDED
    decision_due: 2026-09-24        # "porsurffi vol 2 meet 1", 18:00-18:45 EEST
    analysis: docs/2027-destination-analysis.md
    ranking: docs/2027-destination-ranking.md   # scored, all options, with price ranges
    recommended_shortlist: [el-salvador, lombok]
    fallback: nicaragua
    eliminated:
      brazil-ne: "Pipa/Itacare peak Dec-Mar; May is shoulder + tail of the rainy season"
      portugal:  "excluded by Joel; also weak in spring"
      sri-lanka: "excluded by Joel - not repeating 2026"
    not_recommended:
      siargao: >
        REVISED 2026-09-21. First pass eliminated this as flat; too absolute. Cloud 9 and
        west-facing breaks are onshore Mar-Jun, but Daku and east-coast breaks pick up S
        swell and spring gives clean waist-to-head-high. Real objection is VARIANCE, not
        flatness - the famous wave will not be working.
      morocco: "May is the END of the season; Jun-Sep often flat. Too soft for this group."
      guatemala: >
        El Paredon is a hollow, fast beach break, head-high+ from May. Sand bottom is right
        but the wave is higher-consequence than a point break for a group averaging 7 sessions.
    still_open: [costa-rica, mexico, bali, peru, panama, rio-de-janeiro, java-batu-karas]
    source: analysis 2026-09-21; candidate list from organizer chat 2026-09-17

  dates:
    status: FLEXIBLE_BY_DESIGN
    depart_window: {earliest: 2027-05-03, latest: 2027-05-10}
    trip_length_days: {min: 9, max: 12}
    note: Dates are deliberately unlocked so flight price can drive them.
    source: Joel 2026-09-21

  surf_level:
    range_sessions: {min: 0, max: 50}
    average_sessions: 7
    requirement: >
      Not beginner-only mush. Waves need size and push but must not be harsh.
      Arugam Bay 2026 was described as optimal — a long, sand-bottomed point break.
      Sand bottom is strongly preferred over reef at this level.
    source: Joel 2026-09-21

  cost_basis:
    included_in_estimates: [return flights from HEL incl. 23kg checked bag, surf camp accommodation + lessons]
    excluded: [food beyond camp inclusions, visas, local transfers, merch, program, contingency]
    note: >
      Retail per-person rates are NOT what a 30-person block pays. 2026's camp cost
      370 USD ~= EUR 310 for 8 nights (~EUR 39/night), far below any advertised rate.
      Expect 20-40% off retail when negotiating. Always ask for the group rate.
    baggage: >
      Everyone needs 23-30kg checked, not carry-on, on a 9-12 day trip. Compare landed
      cost with bags included. Turkish/Qatar/Emirates/Finnair include it; verify Juneyao
      and other low-cost long-haul fare classes.
    source: Joel 2026-09-21 + research

  requirements:
    single_supplier: >
      Strongly preferred: accommodation AND surf lessons from the same surf camp,
      with instructors available throughout the trip, including coaching for the
      more experienced so they progress too.
    camp_criteria: >
      Not the most obvious or commercialised operator. Genuine high ratings.
      Locally run is a plus. Must not be a scam. If nothing suitable exists,
      list every option so the team can vet manually.
    all_participants_18_plus: true
    source: Joel 2026-09-21

  headcount:
    target: 30
    organizers: 6
    participant_places: 24
    note: 2026 targeted 30 and landed 25. Filling the last five seats is an explicit goal.
    source: Joel 2026-09-21

  budget:
    all_in_per_participant: null    # UNDECIDED
    reference_2026: "1150-1250 EUR"
    flight_estimate_2027:
      individual: "850-900 EUR incl. bags (640 EUR + 20% risk premium)"
      group_fare: "700-780 EUR for 30 seats, unquoted"
      source: organizer chat 2026-09-17
    funding:
      prodeko_loan_2026: "20000 EUR, 3-month term"
      source: organizer chat 2025-12-02

