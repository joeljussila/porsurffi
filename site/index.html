<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PorSurffi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* Background video, graded to a 1970s camcorder look (see site/README.md) */
    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* The text animation from Claude Design goes in here */
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <video class="bg" autoplay muted loop playsinline preload="auto" poster="assets/poster.jpg" aria-hidden="true">
    <source src="assets/hero.mp4" type="video/mp4">
  </video>

  <main></main>
</body>
</html>
