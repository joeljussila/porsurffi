<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PorSurffi vol. 2</title>
  <meta name="description" content="PorSurffi vol. 2 - ilmo aukeaa 6.10. klo 12.">
  <meta name="theme-color" content="#062A67">
  <meta property="og:title" content="PorSurffi vol. 2">
  <meta property="og:description" content="Ilmo aukeaa 6.10. klo 12.">
  <meta property="og:image" content="assets/poster.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Cyanotype palette, docs/brand.md */
      --navy: #062A67;
      --tide: #205C96;
      --ice: #C2E0E8;
      --orange: #D3462B;
      --coral: #DC7854;
      --white: #F2FAFD;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: "DM Mono", ui-monospace, monospace;
      overflow: hidden;
    }

    /* Background video: already graded to a 1970s camcorder look (see site/README.md) */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg video {
      position: absolute;
      inset: -2%;
      width: 104%;
      height: 104%;
      object-fit: cover;
      animation: weave 7s steps(1) infinite;
    }

    /* Navy wash so the video sits clearly behind the text */
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(6, 42, 103, 0.05) 0%, rgba(6, 42, 103, 0.3) 70%, rgba(0, 0, 0, 0.65) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0%, rgba(6, 42, 103, 0.1) 45%, rgba(0, 0, 0, 0.45) 100%);
    }

    /* Tape scanlines and flicker on top of the video */
    .scan {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
      mix-blend-mode: multiply;
      animation: flicker 0.18s infinite;
    }

    .grain {
      position: fixed;
      inset: -50%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.12;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain 0.6s steps(4) infinite;
    }

    main {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vh, 40px);
      padding: 24px 16px;
      text-align: center;
    }

    .kicker {
      font-size: clamp(11px, 1.4vw, 14px);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ice);
      opacity: 0;
      animation: rise 1.2s 0.3s ease-out forwards;
    }

    h1 {
      font-family: "Shrikhand", serif;
      font-weight: 400;
      font-size: clamp(52px, 12vw, 168px);
      line-height: 0.95;
      color: var(--white);
      text-shadow: 3px 3px 0 var(--orange), 0 0 40px rgba(220, 120, 84, 0.25);
      opacity: 0;
      animation: rise 1.4s 0.5s ease-out forwards;
    }

    h1 span {
      display: block;
      font-size: 0.38em;
      color: var(--coral);
      text-shadow: none;
      margin-top: 0.15em;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 24px);
      width: min(640px, 100%);
      opacity: 0;
      animation: rise 1.2s 0.9s ease-out forwards;
    }

    .unit {
      background: rgba(6, 42, 103, 0.55);
      border: 1px solid rgba(194, 224, 232, 0.25);
      padding: clamp(10px, 2vw, 18px) 4px;
      backdrop-filter: blur(2px);
    }

    .num {
      display: block;
      font-size: clamp(28px, 7vw, 64px);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--white);
    }

    .label {
      display: block;
      margin-top: 4px;
      font-size: clamp(9px, 1.2vw, 12px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ice);
    }

    .when {
      font-size: clamp(13px, 1.8vw, 16px);
      color: var(--ice);
      opacity: 0;
      animation: rise 1.2s 1.2s ease-out forwards;
    }

    .when strong { color: var(--coral); font-weight: 500; }

    .open h1 { animation: rise 1.4s 0.5s ease-out forwards; }
    .open .countdown { display: none; }

    .rec {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 3;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--white);
      opacity: 0.8;
    }

    .rec::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--orange);
      animation: blink 1.2s steps(1) infinite;
    }

    .stamp {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 3;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--ice);
      opacity: 0.8;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
      to { opacity: 1; transform: none; filter: none; }
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    @keyframes grain {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-5%, 3%); }
      50% { transform: translate(4%, -4%); }
      75% { transform: translate(-3%, -2%); }
    }

    /* Slight gate weave, like an old tape transport */
    @keyframes weave {
      0% { transform: translate(0, 0); }
      30% { transform: translate(-0.3%, 0.2%); }
      60% { transform: translate(0.2%, -0.2%); }
      85% { transform: translate(0, 0.3%); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .kicker, h1, .countdown, .when { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto" poster="assets/poster.jpg">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
  </div>
  <div class="scan" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="rec" aria-hidden="true">REC</div>

  <main id="main">
    <p class="kicker">PoRa &times; Prodeko</p>
    <h1>PorSurffi<span>vol. 2</span></h1>

    <div class="countdown" role="timer" aria-live="off">
      <div class="unit"><span class="num" id="d">--</span><span class="label">päivää</span></div>
      <div class="unit"><span class="num" id="h">--</span><span class="label">tuntia</span></div>
      <div class="unit"><span class="num" id="m">--</span><span class="label">min</span></div>
      <div class="unit"><span class="num" id="s">--</span><span class="label">sek</span></div>
    </div>

    <p class="when" id="when">Ilmo aukeaa <strong>ti 6.10. klo 12</strong></p>
  </main>

  <div class="stamp" aria-hidden="true" id="stamp">MAY 2027</div>

  <script>
    // Registration opens 2026-10-06 12:00 Helsinki time (EEST, UTC+3). Source: Meet 1 notes, 2026-09-24.
    var OPENS = new Date("2026-10-06T12:00:00+03:00").getTime();

    var el = {
      d: document.getElementById("d"),
      h: document.getElementById("h"),
      m: document.getElementById("m"),
      s: document.getElementById("s"),
      when: document.getElementById("when")
    };

    function pad(n) { return n < 10 ? "0" + n : String(n); }

    function tick() {
      var left = Math.max(0, OPENS - Date.now());
      if (left === 0) {
        document.getElementById("main").classList.add("open");
        el.when.innerHTML = "<strong>Ilmo on auki.</strong>";
        return;
      }
      var sec = Math.floor(left / 1000);
      el.d.textContent = pad(Math.floor(sec / 86400));
      el.h.textContent = pad(Math.floor(sec % 86400 / 3600));
      el.m.textContent = pad(Math.floor(sec % 3600 / 60));
      el.s.textContent = pad(sec % 60);
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();

    // Respect reduced motion: show the still frame instead of the moving video
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      var v = document.querySelector(".bg video");
      v.removeAttribute("autoplay");
      v.pause();
    }
  </script>
</body>
</html>
