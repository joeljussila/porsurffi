<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The countdown has begun.</title>
<meta name="theme-color" content="#062A67">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #062A67;
    --white: #F2FAFD;
    --dim: 0.15;      /* extra darkening over the background */
    --slide: 24s;     /* full slideshow cycle (3 slides) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--navy); overflow: hidden; }

  .stage {
    position: fixed; inset: 0; overflow: hidden;
    background: var(--navy) url("assets/poster.jpg") center / cover no-repeat;
  }

  /* Background layer. */
  .slides, .slides .slide { position: absolute; inset: 0; }
  .slide {
    background-size: cover; background-position: center;
    filter: saturate(.7) sepia(.2) contrast(1.05);
    opacity: 0;
    animation: kenburns var(--slide) linear infinite;
    will-change: opacity, transform;
  }
  .slide:nth-child(1) { background-image: url("images/still-1.jpg"); animation-delay: 0s; }
  .slide:nth-child(2) { background-image: url("images/still-2.jpg"); animation-delay: calc(var(--slide) * -2 / 3); }
  .slide:nth-child(3) { background-image: url("images/still-3.jpg"); animation-delay: calc(var(--slide) * -1 / 3); }

  .bg-video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(.75) contrast(1.05) sepia(.15);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .bg-video.is-playing { opacity: 1; }

  @keyframes kenburns {
    0%    { opacity: 0; transform: scale(1.06) translate(0, 0); }
    6%    { opacity: 1; }
    33%   { opacity: 1; }
    40%   { opacity: 0; transform: scale(1.18) translate(-2%, -1.5%); }
    100%  { opacity: 0; transform: scale(1.06); }
  }

  .tint  { position: absolute; inset: 0; background: var(--navy); opacity: .5; mix-blend-mode: multiply; pointer-events: none; }
  .shade { position: absolute; inset: 0; background: rgba(2, 8, 20, var(--dim)); pointer-events: none; }
  .center {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 0 max(28px, env(safe-area-inset-left));
  }
  h1 {
    margin: 0; font-family: 'Special Elite', 'Courier New', monospace; font-weight: 400;
    font-size: clamp(28px, 4vw, 64px); line-height: 1.25; letter-spacing: .01em;
    color: var(--white); text-align: center; text-wrap: balance;
  }
  .cursor {
    display: inline-block; width: .55em; height: 1em; margin-left: .08em; vertical-align: -.12em;
    background: var(--white); animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .slide { animation: none; }
    .slide:nth-child(1) { opacity: 1; }
    .bg-video { display: none; }
    .cursor { display: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <video class="bg-video" src="assets/hero.mp4" poster="assets/poster.jpg" muted loop playsinline webkit-playsinline preload="metadata" aria-hidden="true"></video>
    <div class="tint"></div>
    <div class="shade"></div>
    <div class="center">
      <h1 aria-label="The countdown has begun."><span id="tw" aria-hidden="true"></span><span class="cursor" aria-hidden="true"></span></h1>
    </div>
  </main>

<script>
  (function () {
    // Viljami confirmed 2026-10-06 12:00 Helsinki time as the ilmo opening on 2026-09-26.
    // The expiry state is still a placeholder; coordinate the public reveal/ilmo handoff.
    var reveal = new Date('2026-10-06T12:00:00+03:00').getTime();
    var intro = 'The countdown has begun.';
    var video = document.querySelector('.bg-video');
    var el = document.getElementById('tw');
    var heading = el.parentElement;
    var ticker, hold;
    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function keepPosterVisible() {
      video.classList.remove('is-playing');
      video.pause();
    }

    function tryAutoplay() {
      if (reducedMotion || document.visibilityState === 'hidden' || !video.paused) return;
      var playback = video.play();
      if (playback && typeof playback.catch === 'function') playback.catch(keepPosterVisible);
    }

    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.addEventListener('playing', function () { video.classList.add('is-playing'); });
    video.addEventListener('pause', function () {
      if (document.visibilityState === 'visible') video.classList.remove('is-playing');
    });
    video.addEventListener('error', keepPosterVisible);
    video.addEventListener('loadedmetadata', tryAutoplay);
    video.addEventListener('canplay', tryAutoplay, { once: true });
    window.addEventListener('pageshow', tryAutoplay);
    document.addEventListener('visibilitychange', tryAutoplay);
    if (reducedMotion) {
      video.pause();
      video.style.display = 'none';
    } else {
      tryAutoplay();
    }

    function pad(number) { return String(number).padStart(2, '0'); }

    function countdown() {
      var seconds = Math.max(0, Math.ceil((reveal - Date.now()) / 1000));
      var days = Math.floor(seconds / 86400);
      var hours = Math.floor(seconds % 86400 / 3600);
      var minutes = Math.floor(seconds % 3600 / 60);
      return days + 'd ' + pad(hours) + 'h ' + pad(minutes) + 'm ' + pad(seconds % 60) + 's';
    }

    function update() {
      if (Date.now() >= reveal) {
        clearTimeout(ticker);
        clearTimeout(hold);
        el.textContent = 'The reveal is here.';
        heading.setAttribute('aria-label', 'The reveal is here.');
        return;
      }
      var remaining = countdown();
      el.textContent = remaining;
      heading.setAttribute('aria-label', 'Reveal on October 6, 2026 at 12:00 Helsinki time. ' + remaining + ' remaining.');
      ticker = setTimeout(update, 1020 - Date.now() % 1000);
    }

    if (Date.now() >= reveal || reducedMotion) {
      update();
      return;
    }

    function type(text, delay, done) {
      var n = 0;
      function next() {
        el.textContent = text.slice(0, ++n);
        if (n < text.length) setTimeout(next, delay);
        else done();
      }
      next();
    }

    function erase(done) {
      var n = el.textContent.length;
      var text = el.textContent;
      function next() {
        el.textContent = text.slice(0, --n);
        if (n > 0) setTimeout(next, 38);
        else done();
      }
      next();
    }

    function cycle() {
      if (Date.now() >= reveal) return update();
      heading.setAttribute('aria-label', intro);
      type(intro, 105, function () {
        setTimeout(function () {
          erase(function () {
            setTimeout(function () {
              if (Date.now() >= reveal) return update();
              heading.setAttribute('aria-label', 'Countdown to the reveal');
              type(countdown(), 85, function () {
                update();
                if (Date.now() >= reveal) return;
                hold = setTimeout(function () {
                  clearTimeout(ticker);
                  erase(function () { setTimeout(cycle, 450); });
                }, 10000);
              });
            }, 450);
          });
        }, 3200);
      });
    }
    setTimeout(cycle, 600);
  })();
</script>
</body>
</html>
